<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product List</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        color: #333;
        background-color: #f4f4f4;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .container {
        display: flex;
        flex: 1;
      }

      .sidebar {
        width: 250px;
        background-color: #333;
        color: white;
        padding: 20px;
        box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
      }

      .sidebar h2 {
        color: #fff;
        margin-bottom: 20px;
        border-bottom: 2px solid #4caf50;
        padding-bottom: 10px;
      }

      .sidebar ul {
        list-style-type: none;
        padding: 0;
        margin: 0;
      }

      .sidebar ul li {
        margin: 15px 0;
      }

      .sidebar ul li a {
        text-decoration: none;
        color: #4caf50;
        font-weight: bold;
        display: block;
      }

      .sidebar ul li a:hover {
        text-decoration: underline;
        color: #66bb6a;
      }

      .content {
        flex: 1;
        padding: 20px;
        background-color: #fff;
        box-shadow: -2px 0 5px rgba(0, 0, 0, 0.1);
      }

      .content h1 {
        margin-bottom: 20px;
        color: #333;
      }

      .content ul {
        list-style-type: none;
        padding: 0;
        margin: 0;
      }

      .content ul li {
        background: #f9f9f9;
        margin: 10px 0;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        transition: background-color 0.3s ease;
      }

      .content ul li:hover {
        background-color: #f0f0f0;
      }

      .content ul li a {
        text-decoration: none;
        color: #333;
        font-weight: bold;
      }

      .content ul li a:hover {
        text-decoration: underline;
        color: #4caf50;
      }

      @media (max-width: 800px) {
        .container {
          flex-direction: column;
        }

        .sidebar {
          width: 100%;
          box-shadow: none;
          padding-bottom: 0;
        }

        .content {
          box-shadow: none;
          padding: 10px;
        }

        .content ul li {
          margin: 5px 0;
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <h2>Categories</h2>
        <ul>
          {% for category in categories %}
          <li>
            <a href="?category={{ category.id }}" 
               {% if category.id|stringformat:"s" == request.GET.category|stringformat:"s" %}style="color: #66bb6a;"{% endif %}>
              {{ category.name }}
            </a>
          </li>
          {% endfor %}
        </ul>
      </div>

      <div class="content">
        <h1>Products</h1>
        {% if products %}
        <ul>
          {% for product in products %}
          <li>
            <a href="{{ product.get_absolute_url }}">{{ product.name }}</a> -
            ${{ product.price }}
          </li>
          {% endfor %}
        </ul>
        {% else %}
        <p>No products found in this category.</p>
        {% endif %}
      </div>
    </div>
  </body>
</html>
